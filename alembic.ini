# Alembic configuration.  The database URL is NOT set here -- migrations/env.py
# takes it from REPOMAN_DATABASE_URL (or `alembic -x url=...`) so there is one
# source of truth and no credentials in a tracked file.

[alembic]
script_location = src/repository_manager/migrations
prepend_sys_path = src
path_separator = os
# Timestamped filenames sort chronologically and make merge conflicts obvious.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
