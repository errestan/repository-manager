name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories surface without waiting for a commit.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras --dev
      - name: pip-audit
        run: uv run pip-audit --strict --desc

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Mirrors scripts/check_licences.py: GPL-2-only cannot combine with our
          # GPL-3-or-later licence (specification.md 14.1).
          deny-licenses: GPL-2.0-only, AGPL-3.0-only, AGPL-3.0-or-later
