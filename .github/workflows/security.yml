name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories surface without waiting for a commit.
    - cron: "17 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --all-extras --all-groups
      # Audit the exported lockfile rather than the installed environment: the
      # project itself is unpublished, so auditing the environment makes
      # --strict fail on "not found on PyPI" forever. --no-emit-project drops
      # it; the export is fully pinned, so --no-deps/--disable-pip skip
      # resolution entirely and --strict keeps its real meaning -- every
      # third-party dependency was actually audited.
      - name: pip-audit
        run: |
          uv export --format requirements-txt --no-emit-project \
            --all-extras --all-groups --quiet > requirements-audit.txt
          uv run pip-audit --strict --desc --no-deps --disable-pip \
            -r requirements-audit.txt

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Mirrors scripts/check_licences.py: GPL-2-only cannot combine with our
          # GPL-3-or-later licence (specification.md 14.1).
          deny-licenses: GPL-2.0-only, AGPL-3.0-only, AGPL-3.0-or-later
